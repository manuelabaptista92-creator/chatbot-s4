<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot S4</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f8;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    #chat {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    #mensagens {
      height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; }
    .utilizador { align-self: flex-end; background: #4f46e5; color: white; }
    .bot { align-self: flex-start; background: #e5e7eb; }
    #entrada { display: flex; gap: 8px; }
    #entrada input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
    #btnModo {
      margin-top: 12px;
      width: 100%;
      background: #111827;
    }
  </style>
</head>
<body>

  <div id="chat">
    <div id="mensagens"></div>
    <div id="entrada">
      <input type="text" id="mensagem" placeholder="Escreva uma mensagem...">
      <button id="btnEnviar">Enviar</button>
    </div>
    <button id="btnModo">Modo: Intents</button>
  </div>

  <script src="config.js"></script>
  <script>
    // ---------- 1. Respostas fixas (intents) ----------
    const intents = [
      { padroes: ["olá", "ola", "bom dia", "boa tarde"], resposta: "Olá! Como posso ajudar?" },
      { padroes: ["como estás", "como estas"], resposta: "Estou bem, obrigado! E tu?" },
      { padroes: ["adeus", "tchau"], resposta: "Até à próxima!" },
      { padroes: ["obrigado", "obrigada"], resposta: "De nada!" },
      { padroes: ["ajuda"], resposta: "Pode perguntar-me coisas simples, como 'olá' ou 'como estás'." }
    ];

    // Procura uma palavra-chave na mensagem e devolve a resposta fixa
    function responderIntents(texto) {
      const t = texto.toLowerCase();
      for (const intent of intents) {
        if (intent.padroes.some(p => t.includes(p))) {
          return intent.resposta;
        }
      }
      return null; // nenhum intent encontrado
    }

    // ---------- 2. Mostrar mensagens no ecrã ----------
    function adicionarMensagem(texto, autor) {
      const div = document.createElement("div");
      div.className = "msg " + autor;
      div.textContent = texto;
      document.getElementById("mensagens").appendChild(div);
      div.scrollIntoView();
    }

    // ---------- 3. Modo atual (false = Intents, true = LLM) ----------
    let modoLLM = false;

    // ---------- 4. Enviar a mensagem ----------
    async function enviar() {
      const input = document.getElementById("mensagem");
      const texto = input.value.trim();
      if (!texto) return;

      adicionarMensagem(texto, "utilizador");
      input.value = "";

      let resposta;
      if (modoLLM) {
        resposta = await chamarLLM(texto);
      } else {
        resposta = responderIntents(texto) ??
          "Não percebi. Experimente 'olá', 'como estás' ou 'adeus'.";
      }
      adicionarMensagem(resposta, "bot");
    }

    document.getElementById("btnEnviar").addEventListener("click", enviar);

    document.getElementById("mensagem").addEventListener("keydown", (e) => {
      if (e.key === "Enter") enviar();
    });

    // ---------- 5. Chamar a IA (OpenRouter) ----------
    async function chamarLLM(texto) {
      try {
        const resposta = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + OPENROUTER_API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: OPENROUTER_MODEL,
            messages: [
              { role: "system", content: "Responde em português de Portugal, de forma curta." },
              { role: "user", content: texto }
            ],
            max_tokens: 300
          })
        });

        if (!resposta.ok) throw new Error("HTTP " + resposta.status);

        const dados = await resposta.json();
        return dados.choices[0].message.content;
      } catch (erro) {
        console.error(erro);
        return "Erro ao contactar a IA: " + erro.message;
      }
    }

    // ---------- 6. Botão para trocar de modo ----------
    document.getElementById("btnModo").addEventListener("click", () => {
      modoLLM = !modoLLM;
      document.getElementById("btnModo").textContent = modoLLM ? "Modo: LLM" : "Modo: Intents";
    });
  </script>
</body>
</html>
